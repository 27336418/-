name: Build Windows EXE

on:
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: windows-latest # 使用 Windows 环境
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.9' # 使用 Python 3.9

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pandas openpyxl pyinstaller

      - name: 执行 PyInstaller 打包
        run: |
          # 这里假设你的主程序文件名叫 rename_photos_gui.py
          # 如果你的文件名不同，请修改下面这一行
          pyinstaller --onefile --windowed --name "照片重命名工具" rename_photos_gui.py

      - name: 上传打包好的 EXE
        uses: actions/upload-artifact@v3
        with:
          name: Windows-EXE-Build
          path: dist/*.exe
